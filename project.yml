# XcodeGen 工程定义。由 CI 执行 `xcodegen generate` 生成 Cora.xcodeproj（不入库）。
# 主 App + Network Extension 支持 iOS 17；控制中心扩展单独要求 iOS 18。
name: Cora

configs:
  Debug: debug
  Release: release
  InternalTestFlight: release

options:
  bundleIdPrefix: com.miclash
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # CI 不签名，签名由用户自理
  defaultConfig: Release

# 全 target 共享的基础构建设置
settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 本地 Xcode / TestFlight 使用自动签名；CI 仍用命令行参数显式关闭签名。
    # Team 不写入仓库，首次在 Xcode 的 Signing & Capabilities 中为三个 target 选择同一团队。
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"   # 1=iPhone
    # mihomo（Go 运行时）的 net 包在 Darwin 上引用 libresolv 的 res_9_* 符号，
    # 精简的 NE 扩展不会隐式链接它，需显式补链，否则报 undefined symbols。
    OTHER_LDFLAGS: -lresolv -lsqlite3

targets:
  # ───────────────────────── 主 App ─────────────────────────
  Cora:
    type: application
    platform: iOS
    sources:
      - path: Cora
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miclash.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: Cora/Cora.entitlements
    dependencies:
      # 把 NE 扩展嵌入到 App 的 PlugIns 里
      - target: CoraTunnel
        embed: true
      # 控制中心小组件扩展
      - target: CoraControl
        embed: true
      # mihomo 内核框架（CI 由 gomobile bind 产出）。
      # gomobile 的 iOS 输出是静态框架 → 只链接、不嵌入（embed: false）。
      - framework: Vendor/Mihomo.xcframework
        embed: false

  # ──────────────────── Network Extension ───────────────────
  CoraTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: CoraTunnel
      - path: Shared
      - path: Cora/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miclash.app.tunnel
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoraTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoraTunnel/CoraTunnel.entitlements
        # 暴露 libresolv（res_9_*）给 Swift：读取物理网络 DNS，见 SystemDNS.swift
        SWIFT_OBJC_BRIDGING_HEADER: CoraTunnel/CoraTunnel-Bridging-Header.h
    dependencies:
      # mihomo 内核必须在 NE 进程内运行（代理逻辑所在）。静态框架，只链接不嵌入。
      - framework: Vendor/Mihomo.xcframework
        embed: false

  # ──────────────────── 控制中心小组件 ───────────────────
  # iOS 18+ ControlWidget：控制中心里一个「代理开关」磁贴，点击启停 NE 隧道。
  # 只用系统框架（WidgetKit/AppIntents/NetworkExtension，Swift 自动链接），不碰 mihomo。
  CoraControl:
    type: app-extension
    platform: iOS
    sources:
      - path: CoraControl
      - path: Shared
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.miclash.app.control
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoraControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoraControl/CoraControl.entitlements

# 显式 scheme，确保 CI 里 `xcodebuild -scheme Cora` 能找到（含嵌入的 NE 扩展）
schemes:
  Cora:
    build:
      targets:
        Cora: all
    run:
      config: Debug
    archive:
      config: InternalTestFlight
