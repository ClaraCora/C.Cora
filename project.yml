# XcodeGen 工程定义。由 CI 执行 `xcodegen generate` 生成 Cora.xcodeproj（不入库）。
# 标准 App、Network Extension 与控制中心扩展统一支持 iOS 18。
# Legacy / Go 源码仅保留作回退参考，不再参与构建。
name: Cora

configs:
  Debug: debug
  Release: release
  InternalTestFlight: release

options:
  bundleIdPrefix: com.miclash
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # CI 不签名，签名由用户自理
  defaultConfig: Release

# 全 target 共享的基础构建设置
settings:
  base:
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 本地 Xcode / TestFlight 使用自动签名；CI 仍用命令行参数显式关闭签名。
    # Team 不写入仓库，首次在 Xcode 的 Signing & Capabilities 中为三个 target 选择同一团队。
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"   # 1=iPhone
    # 系统 DNS 桥接使用 libresolv；Rust logbook 与连接历史共用系统 SQLite。
    # rustc's static archives do not propagate native framework linker flags
    # to Swift. These are needed by Apple's DNS/network and TLS/cert bindings.
    OTHER_LDFLAGS: -lresolv -lsqlite3 -lc++ -framework Security -framework SystemConfiguration -framework CoreFoundation

targets:
  # ───────────────────────── 主 App ─────────────────────────
  Cora:
    type: application
    platform: iOS
    sources:
      - path: Cora
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miclash.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: Cora/Cora.entitlements
    dependencies:
      # 把 NE 扩展嵌入到 App 的 PlugIns 里
      - target: CoraTunnel
        embed: true
      # 控制中心小组件扩展
      - target: CoraControl
        embed: true
      # Rust C ABI 静态库：App 仅调用离线配置与校验接口。
      - framework: Vendor/MeowCore.xcframework
        embed: false

  # ──────────────────── Network Extension ───────────────────
  CoraTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: CoraTunnel
      - path: Shared
      - path: Cora/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miclash.app.tunnel
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoraTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoraTunnel/CoraTunnel.entitlements
        # 暴露 libresolv（res_9_*）给 Swift：读取物理网络 DNS，见 SystemDNS.swift
        SWIFT_OBJC_BRIDGING_HEADER: CoraTunnel/CoraTunnel-Bridging-Header.h
    dependencies:
      # Rust engine / tun2socks 在 NE 进程运行，静态链接。
      - framework: Vendor/MeowCore.xcframework
        embed: false

  # ──────────────────── 控制中心小组件 ───────────────────
  # iOS 18+ ControlWidget：控制中心里一个「代理开关」磁贴，点击启停 NE 隧道。
  # 只用系统框架（WidgetKit/AppIntents/NetworkExtension，Swift 自动链接），不链接代理内核。
  CoraControl:
    type: app-extension
    platform: iOS
    sources:
      - path: CoraControl
      - path: Shared
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.miclash.app.control
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoraControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoraControl/CoraControl.entitlements

# 标准版唯一 scheme，保留 Control Widget。
schemes:
  Cora:
    build:
      targets:
        Cora: all
    run:
      config: Debug
    archive:
      config: InternalTestFlight
