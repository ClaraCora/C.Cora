name: Build unsigned IPA

# 在 macos-26（Xcode 26）上：先用 gomobile 把 mihomo 编成 Mihomo.xcframework，
# 再生成 Xcode 工程并构建未签名 ipa。签名由用户用自有开发者证书自理。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 Xcode 26，确保 SwiftUI 原生液态玻璃 Tab 栏 API 可编译。
      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_26.4.1.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "$XCODE_APP 不存在，当前 runner 可用 Xcode："
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "--- installed iphoneos SDKs ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      # ───────────── Phase 1：gomobile 编 mihomo 内核 ─────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-1.25.4-${{ hashFiles('MobileCore/go.mod', 'MobileCore/go.sum', 'MobileCore/third_party/sing-shadowsocks2/**') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build Mihomo.xcframework (gomobile bind)
        run: |
          set -euxo pipefail
          # “|direct” 会在代理 DNS/网络错误时也回退源码站；逗号仅在 404/410 时回退。
          export GOPROXY="https://proxy.golang.org|direct"
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 5 ]; then
                return 1
              fi
              sleep $((n * 10))
              n=$((n + 1))
            done
          }
          MOBILE_VERSION="v0.0.0-20260611195102-4dd8f1dbf5d2"
          retry go install golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}
          retry go install golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd MobileCore
          # 用 tool 指令把 golang.org/x/mobile 钉进模块依赖图，
          # 否则 go mod tidy 会因源码未直接 import 而剪掉它，导致 gomobile bind 报
          # "requires golang.org/x/mobile in the current module"
          retry go get -tool golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          # go.mod 已 pin mihomo 版本；tidy 补齐间接依赖与 go.sum
          retry go mod tidy
          # SS2022 最大记录修复必须只替换 v0.2.7；内核升级后不允许静默套用旧补丁。
          SS2_MODULE=$(go list -m -f '{{.Version}}|{{if .Replace}}{{.Replace.Path}}{{end}}' github.com/metacubex/sing-shadowsocks2)
          if [ "$SS2_MODULE" != "v0.2.7|./third_party/sing-shadowsocks2" ]; then
            echo "unexpected sing-shadowsocks2 resolution: $SS2_MODULE"
            exit 1
          fi
          go test github.com/metacubex/sing-shadowsocks2/internal/shadowio
          go test -tags "with_low_memory" github.com/metacubex/sing-shadowsocks2/internal/shadowio
          go test -tags "with_gvisor,with_low_memory" ./...
          # 取出真实 mihomo 版本，用 ldflags 注入 constant.Version
          # （源码默认值是陈旧占位串，官方靠 ldflags 注入真实版本，这里照做）
          MIHOMO_VERSION=$(retry go list -m -f '{{.Version}}' github.com/metacubex/mihomo)
          echo "注入 mihomo 版本：${MIHOMO_VERSION}"
          # 交叉编译 mihomo 为 iOS 框架（含 device arm64 + simulator 切片）。
          # with_gvisor：同时编入 gVisor / mixed，供设置页在三种栈间切换；with_low_memory：转发缓冲减半，降低峰值。
          gomobile bind \
            -tags "with_gvisor,with_low_memory" \
            -ldflags="-X github.com/metacubex/mihomo/constant.Version=${MIHOMO_VERSION}" \
            -target=ios -o ../Vendor/Mihomo.xcframework .
          echo "===== Mihomo.xcframework 切片 ====="
          ls -R ../Vendor/Mihomo.xcframework | head -40
          echo "===== Info.plist ====="
          cat ../Vendor/Mihomo.xcframework/Info.plist

      # ───────────── 生成工程并构建 App ─────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          # 主 App、Tunnel、Control 必须随每次产物递增 build 号；否则覆盖安装时
          # iOS 可能继续使用旧的 Network Extension 注册，表现为连接后立即断开。
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "CFBundleVersion: ${BUILD_NUMBER}"
          xcodebuild \
            -project MiClash.xcodeproj \
            -scheme MiClash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package into .ipa (unsigned)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/MiClash.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"; exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr MiClash-unsigned.ipa Payload
          echo "已生成 MiClash-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiClash-unsigned-ipa
          path: MiClash-unsigned.ipa
          if-no-files-found: error
