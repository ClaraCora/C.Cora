name: Build unsigned IPA

on:
  push:
    branches: [main, meow-rs]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      # rustup selects by working directory, not --manifest-path. Pin root
      # test commands as well as the commands run inside MobileCoreRust/.
      RUSTUP_TOOLCHAIN: '1.95.0'
      IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_APP=/Applications/Xcode_26.4.1.app
          test -d "$XCODE_APP" || { ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Install pinned Rust and Apple targets
        run: |
          cd MobileCoreRust
          rustup show active-toolchain
          rustup component add rustfmt
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            MobileCoreRust/cora-config/target
            MobileCoreRust/meow-ios-ffi/target
          key: ${{ runner.os }}-rust-${{ hashFiles('MobileCoreRust/rust-toolchain.toml', 'MobileCoreRust/**/Cargo.lock', 'MobileCoreRust/**/Cargo.toml') }}
      - name: Test immutable configuration and project boundaries
        run: |
          cargo fmt --check --manifest-path MobileCoreRust/cora-config/Cargo.toml
          cargo fmt --check --manifest-path MobileCoreRust/meow-ios-ffi/Cargo.toml
          cargo test --locked --manifest-path MobileCoreRust/cora-config/Cargo.toml
          python3 scripts/test-meow-migration.py
          python3 scripts/test-ipa-release.py
      - name: Test FFI lifecycle, packets and traffic
        run: |
          cd MobileCoreRust/meow-ios-ffi
          # Tests share process-wide engine/home/runtime state.
          cargo test --locked --lib -- --test-threads=1
      - name: Test Swift persistence and control protocol
        run: |
          bash scripts/test-connection-history.sh
          bash scripts/test-ipc-response-cache.sh
          bash scripts/test-ipc-control-scheduler.sh
          bash scripts/test-proxy-controller.sh
          bash scripts/test-kernel-memory.sh
          bash scripts/test-core-compatibility.sh
      - name: Build MeowCore device and arm64 simulator slices
        run: bash MobileCoreRust/scripts/build-ios-xcframework.sh
      - name: Install XcodeGen and generate standard project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build standard iOS 18 app unsigned
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          xcodebuild -project Cora.xcodeproj -scheme Cora -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            clean build 2>&1 | tee "$RUNNER_TEMP/cora-xcodebuild.log"
      - name: Verify standard binary and deployment gates
        run: bash scripts/verify-meow-app.sh build/Build/Products/Release-iphoneos/Cora.app
      - name: Package standard unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/Cora.app Payload/Cora.app
          zip -qr Cora-unsigned.ipa Payload
      - name: Publish standard IPA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release-iphoneos/Cora.app/Info.plist)"
          bash scripts/publish-ipa-release.sh
