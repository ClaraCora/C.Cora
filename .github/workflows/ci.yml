name: Build unsigned IPA

# 在 macos-26（Xcode 26）上：先用 gomobile 把 mihomo 编成 Mihomo.xcframework，
# 再生成 Xcode 工程并构建未签名 ipa。签名由用户用自有开发者证书自理。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 Xcode 26，确保 SwiftUI 原生液态玻璃 Tab 栏 API 可编译。
      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_26.4.1.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "$XCODE_APP 不存在，当前 runner 可用 Xcode："
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "--- installed iphoneos SDKs ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      # ───────────── Phase 1：gomobile 编 mihomo 内核 ─────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Enable iOS ARM64 AES-GCM acceleration
        run: bash MobileCore/scripts/prepare-ios-go-toolchain.sh

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('MobileCore/go.sum', 'MobileCore/dependency-patches/**', 'MobileCore/scripts/**') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install Go mobile tools and resolve MobileCore
        run: |
          set -euxo pipefail
          # “|direct” 会在代理 DNS/网络错误时也回退源码站；逗号仅在 404/410 时回退。
          export GOPROXY="https://proxy.golang.org|direct"
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 5 ]; then
                return 1
              fi
              sleep $((n * 10))
              n=$((n + 1))
            done
          }
          MOBILE_VERSION="v0.0.0-20260611195102-4dd8f1dbf5d2"
          retry go install golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}
          retry go install golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          printf '%s\n' "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cd MobileCore
          # 用 tool 指令把 golang.org/x/mobile 钉进模块依赖图，
          # 否则 go mod tidy 会因源码未直接 import 而剪掉它，导致 gomobile bind 报
          # "requires golang.org/x/mobile in the current module"
          retry go get -tool golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          # go.mod 已 pin mihomo 版本；tidy 补齐间接依赖与 go.sum
          retry go mod tidy
      - name: Prepare patched sing allocator
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_SING="$(bash scripts/prepare-ios-sing.sh)"
          printf 'PATCHED_SING=%s\n' "$PATCHED_SING" >> "$GITHUB_ENV"

      - name: Prepare patched Mihomo allocator
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_MIHOMO="$(PATCHED_SING_DIR="$PATCHED_SING" bash scripts/prepare-ios-mihomo.sh)"
          printf 'PATCHED_MIHOMO=%s\n' "$PATCHED_MIHOMO" >> "$GITHUB_ENV"

      - name: Prepare patched gVisor
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_GVISOR="$(bash scripts/prepare-ios-gvisor.sh)"
          printf 'PATCHED_GVISOR=%s\n' "$PATCHED_GVISOR" >> "$GITHUB_ENV"

      - name: Prepare patched sing-tun
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_SING_TUN="$(bash scripts/prepare-ios-sing-tun.sh)"
          printf 'PATCHED_SING_TUN=%s\n' "$PATCHED_SING_TUN" >> "$GITHUB_ENV"

      - name: Prepare patched Shadowsocks reader
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_SS2="$(PATCHED_SING_DIR="$PATCHED_SING" bash scripts/prepare-ios-sing-shadowsocks2.sh)"
          printf 'PATCHED_SS2=%s\n' "$PATCHED_SS2" >> "$GITHUB_ENV"

      - name: Verify patched sing allocator
        run: |
          set -euxo pipefail
          go -C "$PATCHED_SING" test ./common/buf
          go -C "$PATCHED_SING" test -tags "with_low_memory" ./common/buf

      - name: Verify patched Mihomo allocator
        run: |
          set -euxo pipefail
          go -C "$PATCHED_MIHOMO" test ./common/pool ./config
          go -C "$PATCHED_MIHOMO" test -tags "with_low_memory" ./common/pool ./config

      - name: Verify patched gVisor TCP
        run: |
          set -euxo pipefail
          go -C "$PATCHED_GVISOR" test ./pkg/tcpip/transport/tcp

      - name: Verify patched sing-tun Darwin transport
        run: |
          set -euxo pipefail
          go -C "$PATCHED_SING_TUN" test -tags "with_gvisor,with_low_memory" \
            . ./internal/fdbased_darwin

      - name: Verify patched Shadowsocks reader
        run: |
          set -euxo pipefail
          go -C "$PATCHED_SS2" test ./internal/shadowio
          go -C "$PATCHED_SS2" test -tags "with_low_memory" ./internal/shadowio

      - name: Test MobileCore with patched dependencies
        run: |
          set -euxo pipefail
          cd MobileCore
          go test -tags "with_gvisor,with_low_memory" ./...

      - name: Build Mihomo.xcframework (gomobile bind)
        run: bash MobileCore/scripts/build-ios-xcframework.sh

      # ───────────── 生成工程并构建 App ─────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          # 主 App、Tunnel、Control 必须随每次产物递增 build 号；否则覆盖安装时
          # iOS 可能继续使用旧的 Network Extension 注册，表现为连接后立即断开。
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "CFBundleVersion: ${BUILD_NUMBER}"
          xcodebuild \
            -project Cora.xcodeproj \
            -scheme Cora \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package into .ipa (unsigned)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Cora.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"; exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Cora-unsigned.ipa Payload
          echo "已生成 Cora-unsigned.ipa"

      - name: Package TrollStore IPA
        run: |
          set -euo pipefail
          SOURCE_APP="build/Build/Products/Release-iphoneos/Cora.app"
          TS_ROOT="$RUNNER_TEMP/cora-trollstore"
          TS_APP="$TS_ROOT/Payload/Cora.app"
          rm -rf "$TS_ROOT"
          mkdir -p "$TS_ROOT/Payload"
          ditto "$SOURCE_APP" "$TS_APP"

          # TrollStore targets iOS 14-17. The iOS 18-only ControlWidget cannot
          # run there and should not participate in plugin validation/loading.
          rm -rf "$TS_APP/PlugIns/CoraControl.appex"

          # Mark both processes so only the TrollStore package uses the shared
          # file IPC fallback. The ordinary IPA keeps official NE messaging.
          /usr/libexec/PlistBuddy -c \
            'Add :CoraTrollStoreBuild bool true' "$TS_APP/Info.plist"
          /usr/libexec/PlistBuddy -c \
            'Add :CoraTrollStoreBuild bool true' \
            "$TS_APP/PlugIns/CoraTunnel.appex/Info.plist"

          # TrollStore preserves arbitrary entitlements already present in each binary.
          # Both processes need the complete iOS 17 unsandboxing entitlement set
          # while retaining access to their own app data containers.
          codesign --force --sign - --generate-entitlement-der \
            --entitlements CoraTunnel/CoraTunnel-TrollStore.entitlements \
            "$TS_APP/PlugIns/CoraTunnel.appex"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements Cora/Cora-TrollStore.entitlements \
            "$TS_APP"

          MAIN_ENTITLEMENTS="$RUNNER_TEMP/cora-main-entitlements.plist"
          TUNNEL_ENTITLEMENTS="$RUNNER_TEMP/cora-tunnel-entitlements.plist"
          codesign -d --entitlements :- "$TS_APP" > "$MAIN_ENTITLEMENTS" 2>/dev/null
          codesign -d --entitlements :- \
            "$TS_APP/PlugIns/CoraTunnel.appex" > "$TUNNEL_ENTITLEMENTS" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :CoraTrollStoreBuild' "$TS_APP/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :CoraTrollStoreBuild' \
            "$TS_APP/PlugIns/CoraTunnel.appex/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :application-identifier' "$MAIN_ENTITLEMENTS")" \
            = "TROLLTROLL.com.miclash.app"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :application-identifier' "$TUNNEL_ENTITLEMENTS")" \
            = "TROLLTROLL.com.miclash.app.tunnel"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :com.apple.private.security.no-sandbox' "$MAIN_ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :com.apple.private.security.no-sandbox' "$TUNNEL_ENTITLEMENTS")" = "true"
          for ENTITLEMENTS in "$MAIN_ENTITLEMENTS" "$TUNNEL_ENTITLEMENTS"; do
            test "$(/usr/libexec/PlistBuddy -c \
              'Print :platform-application' "$ENTITLEMENTS")" = "true"
            test "$(/usr/libexec/PlistBuddy -c \
              'Print :com.apple.private.security.storage.AppDataContainers' \
              "$ENTITLEMENTS")" = "true"
            test "$(/usr/libexec/PlistBuddy -c \
              'Print :com.apple.developer.team-identifier' "$ENTITLEMENTS")" \
              = "TROLLTROLL"
            test "$(/usr/libexec/PlistBuddy -c \
              'Print :com.apple.developer.networking.networkextension:0' \
              "$ENTITLEMENTS")" = "packet-tunnel-provider"
          done
          cd "$TS_ROOT"
          zip -qr "$GITHUB_WORKSPACE/Cora-TrollStore.ipa" Payload
          echo "已生成 Cora-TrollStore.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cora-unsigned-ipa
          path: Cora-unsigned.ipa
          if-no-files-found: error

      - name: Upload TrollStore artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cora-trollstore-ipa
          path: Cora-TrollStore.ipa
          if-no-files-found: error
