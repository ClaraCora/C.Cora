name: Build unsigned IPA

# 在 macos-15（Xcode 16）上：先用 gomobile 把 mihomo 编成 Mihomo.xcframework，
# 再生成 Xcode 工程并构建未签名 ipa。签名由用户用自有开发者证书自理。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # ───────────── Phase 1：gomobile 编 mihomo 内核 ─────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('MobileCore/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build Mihomo.xcframework (gomobile bind)
        run: |
          set -euxo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd MobileCore
          # 解析依赖版本（首次构建用 @latest，成功后再 pin）
          go get github.com/metacubex/mihomo@latest
          # 用 tool 指令把 golang.org/x/mobile 钉进模块依赖图，
          # 否则 go mod tidy 会因源码未直接 import 而剪掉它，导致 gomobile bind 报
          # "requires golang.org/x/mobile in the current module"
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          # 交叉编译 mihomo 为 iOS 框架（含 device arm64 + simulator 切片）
          gomobile bind -target=ios -o ../Vendor/Mihomo.xcframework .
          echo "===== Mihomo.xcframework 切片 ====="
          ls -R ../Vendor/Mihomo.xcframework | head -40
          echo "===== Info.plist ====="
          cat ../Vendor/Mihomo.xcframework/Info.plist

      # ───────────── 生成工程并构建 App ─────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project MiClash.xcodeproj \
            -scheme MiClash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package into .ipa (unsigned)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/MiClash.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"; exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr MiClash-unsigned.ipa Payload
          echo "已生成 MiClash-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiClash-unsigned-ipa
          path: MiClash-unsigned.ipa
          if-no-files-found: error
