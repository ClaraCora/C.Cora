name: Build unsigned IPA

# 在 macos-26（Xcode 26）上：先用 gomobile 把 mihomo 编成 Mihomo.xcframework，
# 再生成 Xcode 工程并构建未签名 ipa。签名由用户用自有开发者证书自理。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write # Create build tags/releases and upload IPA assets.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 Xcode 26，确保 SwiftUI 原生液态玻璃 Tab 栏 API 可编译。
      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_26.4.1.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "$XCODE_APP 不存在，当前 runner 可用 Xcode："
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "--- installed iphoneos SDKs ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Test connection history persistence
        run: bash scripts/test-connection-history.sh

      - name: Test bounded IPC response storage
        run: bash scripts/test-ipc-response-cache.sh

      - name: Test bounded IPC control scheduling
        run: bash scripts/test-ipc-control-scheduler.sh

      - name: Test TrollStore IPC request limits
        run: bash scripts/test-trollstore-ipc-policy.sh

      - name: Test manual NE memory release
        run: bash scripts/test-kernel-memory.sh

      - name: Test single-node delay feedback
        run: bash scripts/test-proxy-controller.sh

      - name: Test PO0 whitelist settings
        run: bash scripts/test-po0-whitelist.sh

      - name: Test IPA release publication
        run: python3 scripts/test-ipa-release.py

      # ───────────── Phase 1：gomobile 编 mihomo 内核 ─────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Enable iOS ARM64 AES-GCM acceleration
        run: bash MobileCore/scripts/prepare-ios-go-toolchain.sh

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('MobileCore/go.sum', 'MobileCore/dependency-patches/**', 'MobileCore/scripts/**') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download pinned Go module sources
        run: |
          set -euxo pipefail
          # “|direct” 会在代理 DNS/网络错误时也回退源码站；逗号仅在 404/410 时回退。
          export GOPROXY="https://proxy.golang.org|direct"
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 5 ]; then
                return 1
              fi
              sleep $((n * 10))
              n=$((n + 1))
            done
          }
          cd MobileCore
          # 先下载固定版本的模块源码，供补丁脚本定位；补丁就绪后再解析依赖。
          retry go mod download

      - name: Prepare patched sing allocator
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_SING="$(bash scripts/prepare-ios-sing.sh)"
          printf 'PATCHED_SING=%s\n' "$PATCHED_SING" >> "$GITHUB_ENV"

      - name: Prepare patched Mihomo
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_MIHOMO="$(PATCHED_SING_DIR="$PATCHED_SING" bash scripts/prepare-ios-mihomo.sh)"
          printf 'PATCHED_MIHOMO=%s\n' "$PATCHED_MIHOMO" >> "$GITHUB_ENV"

      - name: Prepare patched gVisor
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_GVISOR="$(bash scripts/prepare-ios-gvisor.sh)"
          printf 'PATCHED_GVISOR=%s\n' "$PATCHED_GVISOR" >> "$GITHUB_ENV"

      - name: Prepare patched sing-tun
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_SING_TUN="$(bash scripts/prepare-ios-sing-tun.sh)"
          printf 'PATCHED_SING_TUN=%s\n' "$PATCHED_SING_TUN" >> "$GITHUB_ENV"
          go -C "$PATCHED_MIHOMO" mod edit -replace="github.com/metacubex/sing-tun@v0.4.27=$PATCHED_SING_TUN"
          go -C "$PATCHED_MIHOMO" mod edit -replace="github.com/metacubex/gvisor@v0.0.0-20260922041103-e2cbcd6e7400=$PATCHED_GVISOR"

      - name: Prepare patched Shadowsocks reader
        run: |
          set -euxo pipefail
          cd MobileCore
          PATCHED_SS2="$(PATCHED_SING_DIR="$PATCHED_SING" bash scripts/prepare-ios-sing-shadowsocks2.sh)"
          printf 'PATCHED_SS2=%s\n' "$PATCHED_SS2" >> "$GITHUB_ENV"

      - name: Install Go mobile tools and resolve patched MobileCore
        run: |
          set -euxo pipefail
          export GOPROXY="https://proxy.golang.org|direct"
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 5 ]; then
                return 1
              fi
              sleep $((n * 10))
              n=$((n + 1))
            done
          }
          MOBILE_VERSION="v0.0.0-20260611195102-4dd8f1dbf5d2"
          retry go install golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}
          retry go install golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          printf '%s\n' "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cd MobileCore
          # 所有版本绑定补丁及 replace 就绪后，才能运行解析源码 import 的命令。
          # 用 tool 指令保留 golang.org/x/mobile，避免 tidy 剪掉 gomobile 所需依赖。
          retry go get -tool golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          retry go mod tidy

      - name: Verify patched sing allocator
        run: |
          set -euxo pipefail
          go -C "$PATCHED_SING" test ./common/buf
          go -C "$PATCHED_SING" test -tags "with_low_memory" ./common/buf
          go -C "$PATCHED_SING" test -race -run 'TestTrimIdle' ./common/buf

      - name: Verify patched Mihomo
        run: |
          set -euxo pipefail
          go -C "$PATCHED_MIHOMO" test ./common/pool ./common/lru ./component/fakeip ./config ./tunnel ./tunnel/statistic ./component/dialer ./component/resolver ./component/resource ./dns ./adapter/outbound ./adapter/provider ./adapter/outboundgroup ./hub/executor ./hub/route ./rules/provider ./ntp/ntp ./transport/anytls/session ./transport/openvpn
          go -C "$PATCHED_MIHOMO" test -tags "with_low_memory" ./common/pool ./common/lru ./component/fakeip ./config ./tunnel ./tunnel/statistic ./component/dialer ./component/resolver ./component/resource ./dns ./adapter/outbound ./adapter/provider ./adapter/outboundgroup ./hub/executor ./hub/route ./rules/provider ./ntp/ntp ./transport/anytls/session ./transport/openvpn
          go -C "$PATCHED_MIHOMO" test -race -run 'TestTrimIdle|TestDiagnostic' ./common/pool ./common/lru ./component/fakeip ./dns ./rules/provider
          go -C "$PATCHED_MIHOMO" test -race -run 'TestRuntime' ./component/resource ./adapter/provider ./hub/executor ./ntp/ntp
          go -C "$PATCHED_MIHOMO" vet ./tunnel ./component/dialer ./component/resolver ./component/resource ./dns ./adapter/outbound ./adapter/provider ./hub/executor ./hub/route ./rules/provider ./ntp/ntp
          go -C "$PATCHED_MIHOMO" vet -tags "with_low_memory" ./tunnel ./component/dialer ./component/resolver ./component/resource ./dns ./adapter/outbound ./adapter/provider ./hub/executor ./hub/route ./rules/provider ./ntp/ntp

      - name: Verify patched gVisor TCP
        run: |
          set -euxo pipefail
          go -C "$PATCHED_GVISOR" test ./pkg/tcpip/transport/tcp ./pkg/tcpip/link/qdisc ./pkg/tcpip/link/qdisc/fifo
          go -C "$PATCHED_GVISOR" test -race -run 'TestDiagnostic' ./pkg/tcpip/link/qdisc/fifo

      - name: Verify patched sing-tun Darwin transport
        run: |
          set -euxo pipefail
          go -C "$PATCHED_SING_TUN" test -tags "with_gvisor,with_low_memory" \
            . ./internal/fdbased_darwin

      - name: Verify patched Shadowsocks reader
        run: |
          set -euxo pipefail
          go -C "$PATCHED_SS2" test ./internal/shadowio
          go -C "$PATCHED_SS2" test -tags "with_low_memory" ./internal/shadowio

      - name: Test MobileCore with patched dependencies
        run: |
          set -euxo pipefail
          cd MobileCore
          go test ./...
          go test -tags "with_gvisor,with_low_memory" ./...
          go test -race -run 'TestRuntimeControl|TestRuntimeLogHome' ./...
          go vet ./...
          go vet -tags "with_gvisor,with_low_memory" ./...

      - name: Verify memory diagnostic analysis compatibility
        run: |
          set -euxo pipefail
          swiftc Cora/Core/ByteFormat.swift Cora/Core/MemoryDiagnosticAnalyzer.swift \
            Tests/MemoryDiagnosticAnalyzerTests.swift -o "$RUNNER_TEMP/memory-diagnostic-analyzer-tests"
          "$RUNNER_TEMP/memory-diagnostic-analyzer-tests"

      - name: Build standard Mihomo.xcframework (gomobile bind)
        run: |
          set -euxo pipefail
          bash MobileCore/scripts/build-ios-xcframework.sh

      # ───────────── 生成工程并构建 App ─────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build standard app (unsigned)
        run: |
          set -euo pipefail
          # App 与 Tunnel 产物都必须随每次构建递增 build 号；否则覆盖安装时
          # iOS 可能继续使用旧的 Network Extension 注册，表现为连接后立即断开。
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "CFBundleVersion: ${BUILD_NUMBER}"
          build_scheme() {
            local scheme="$1"
            local derived_data="$2"
            local build_log="$RUNNER_TEMP/${scheme}-xcodebuild.log"
            set +e
            xcodebuild \
              -project Cora.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$derived_data" \
              CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean build 2>&1 | tee "$build_log"
            local build_status="${PIPESTATUS[0]}"
            set -e
            if [[ "$build_status" -ne 0 ]]; then
              while IFS= read -r diagnostic; do
                echo "::error title=${scheme} Xcode build::$diagnostic"
              done < <({ grep -E '\.swift:[0-9]+:[0-9]+: error:|error:' "$build_log" || true; } | tail -n 50)
              exit "$build_status"
            fi
          }
          build_scheme Cora build

      - name: Package into .ipa (unsigned)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Cora.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 $APP_PATH"; exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Cora-unsigned.ipa Payload
          echo "已生成 Cora-unsigned.ipa"

      - name: Publish IPAs to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            build/Build/Products/Release-iphoneos/Cora.app/Info.plist)"
          export APP_VERSION
          bash scripts/publish-ipa-release.sh
